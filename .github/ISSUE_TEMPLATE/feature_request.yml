name: Feature request
description: Suggest a new flag, format, schema field, or CLI capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. kollect-render stays **credential-free and
        network-free** — proposals that need cloud APIs, cluster access, or stored secrets
        belong in a different tool.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and the gap in the current CLI.
      placeholder: I need to render X, but today I have to post-process with...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A new flag, format, schema field, or behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have evaluated.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to related issues, schema drafts, or example context files.
    validations:
      required: false
