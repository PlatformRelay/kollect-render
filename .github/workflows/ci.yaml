name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          OS=linux
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch ${ARCH}" >&2; exit 1 ;;
          esac
          TARBALL="gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Pinned SHA256 digests from gitleaks_${GITLEAKS_VERSION}_checksums.txt
          case "${ARCH}" in
            x64) EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            arm64) EXPECTED_SHA256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
          esac
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE}/${TARBALL}" -o /tmp/gitleaks.tgz
          ACTUAL_SHA256="$(sha256sum /tmp/gitleaks.tgz | awk '{print $1}')"
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "gitleaks tarball checksum mismatch" >&2
            echo "  expected: ${EXPECTED_SHA256}" >&2
            echo "  actual:   ${ACTUAL_SHA256}" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: task check
        run: task check
        env:
          COVERAGE_MIN: "90"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: error

  # SonarCloud: needs repo secret SONAR_TOKEN. Automatic Analysis must stay off
  # (mutually exclusive with CI analysis + Go coverage). Non-blocking per OD-3 —
  # quality gate is ERROR until E4-S02 clears duplication; continue-on-error so
  # that does not block the remediating lanes.
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [check]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Gate on SONAR_TOKEN
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::SONAR_TOKEN secret is unset; SonarCloud scan skipped (fork PRs never receive secrets)."
          else
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: SonarCloud scan
        if: steps.sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
