name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; GitHub App still required for reliable PR comments
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache Go tools build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-tools-${{ hashFiles('Taskfile.yml') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          OS=linux
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch ${ARCH}" >&2; exit 1 ;;
          esac
          TARBALL="gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Pinned SHA256 digests from gitleaks_${GITLEAKS_VERSION}_checksums.txt
          case "${ARCH}" in
            x64) EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            arm64) EXPECTED_SHA256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
          esac
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE}/${TARBALL}" -o /tmp/gitleaks.tgz
          ACTUAL_SHA256="$(sha256sum /tmp/gitleaks.tgz | awk '{print $1}')"
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "gitleaks tarball checksum mismatch" >&2
            echo "  expected: ${EXPECTED_SHA256}" >&2
            echo "  actual:   ${ACTUAL_SHA256}" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: task check
        run: task check
        env:
          COVERAGE_MIN: "90"

      - name: Coverage summary
        run: |
          set -euo pipefail
          {
            echo "### Coverage"
            echo '```'
            if [[ -f coverage-summary.txt ]]; then
              cat coverage-summary.txt
            else
              echo "(coverage-summary.txt not found)"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
          use_oidc: true

  # Cross-OS unit tests. Coverage floor stays on the Linux `check` job only.
  # fail-fast: false so a macOS-only failure still reports the Linux result.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go test
        run: go test ./...

      # GoReleaser ships untested Windows binaries; we do not run windows-latest
      # (bash-shaped coverage/gitleaks/rewe-trace). Cheap compile check only.
      - name: Windows compile check
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./...

  # Full history required: git-cliff compares CHANGELOG.md to regenerated output
  # from tags + commits. Kept separate from `check` (shallow checkout).
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task changelog:verify
        run: task changelog:verify

  # SonarCloud: needs repo secret SONAR_TOKEN. Automatic Analysis must stay off
  # (mutually exclusive with CI analysis + Go coverage). Non-blocking per OD-3 —
  # quality gate is ERROR until E4-S02 clears duplication; continue-on-error so
  # that does not block the remediating lanes.
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Gate on SONAR_TOKEN
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::SONAR_TOKEN secret is unset; SonarCloud scan skipped (fork PRs never receive secrets)."
          else
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: SonarCloud scan
        if: steps.sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
