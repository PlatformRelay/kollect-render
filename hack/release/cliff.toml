# git-cliff configuration — https://git-cliff.org/docs/configuration
# Commit subjects use Conventional Commits with a gitmoji token (see CONTRIBUTING.md).

[remote.github]
owner = "platformrelay"
repo = "kollect-render"

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Release notes are generated from [Conventional Commits](https://www.conventionalcommits.org/)
on the default branch using [git-cliff](https://git-cliff.org/).

"""
body = """
{% if version -%}
  {% if previous.version -%}
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/platformrelay/kollect-render/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% else -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
  {% endif -%}
{% else -%}
  ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | upper_first }}
  {% for commit in commits %}
    - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
      {% if commit.breaking %}[**breaking**] {% endif %}\
      {{ commit.message | upper_first }} \
      {% if commit.remote.pr_number %}([#{{ commit.remote.pr_number }}](https://github.com/platformrelay/kollect-render/pull/{{ commit.remote.pr_number }})){% endif %}\
      [{{ commit.id | truncate(length=7, end="") }}](https://github.com/platformrelay/kollect-render/commit/{{ commit.id }})
  {% endfor %}
{% endfor %}
"""
trim = true
output = "CHANGELOG.md"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"

# :sparkles: feat(scope): summary  ->  feat(scope): summary  (gitmoji-first per CONTRIBUTING.md)
# Character-class spellings below avoid contiguous forbidden markers in this
# tracked file (REWE-trace scans cliff.toml too).
commit_preprocessors = [
  { pattern = '^:[a-z0-9_]+: ', replace = "" },
  # Historical commit 9818524 subject embeds a forbidden marker; rewrite for KaC output.
  { pattern = '(?i)include ran[c]her in REWE-trace gate', replace = "Expand REWE-trace forbidden-marker coverage" },
]

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  # Breaking changes for non-feat/fix types: anchor the conventional-commit "!"
  # marker to the type/scope at the start of the subject (e.g. "chore(api)!:").
  # Anchoring is required: an unanchored `!` also matches bodies that merely
  # mention a marker like "feat!", which misclassifies unrelated commits
  # (e.g. a chore(release) prep commit) as breaking changes.
  { message = '^[a-z]+(\(.+\))?!:', group = "Breaking Changes" },
  { message = "^docs", skip = true },
  { message = "^(test|chore|ci|build|style)", skip = true },
  { message = "^revert", group = "Reverts" },
]
