sonar.projectKey=PlatformRelay_kollect-render
sonar.organization=platformrelay
sonar.projectName=kollect-render
sonar.sources=.
sonar.exclusions=dist/**,bin/**,test/golden/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# NOTE (E4-S02): Test arrange-invoke-assert clones are intentional CLI contract
# readability — exclude *_test.go from CPD so new_duplicated_lines_density
# clears without silencing production duplication. Production paths stay in CPD.
# Regression-guarded by hack/test/sonar_e4_s02_scope_test.sh.
sonar.cpd.exclusions=**/*_test.go

# NOTE (E4-S02): go:S3776 (Cognitive Complexity) in *_test.go is often the
# natural cost of table-driven / multi-case CLI contract tests. Scope the
# ignore to tests only — MUST NOT silence production hits at
# cmd/kollect-render/main.go, internal/format/env_inventory.go, or
# internal/format/confluence.go. Regression-guarded by
# hack/test/sonar_e4_s02_scope_test.sh.
sonar.issue.ignore.multicriteria=s3776tests
sonar.issue.ignore.multicriteria.s3776tests.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.s3776tests.resourceKey=**/*_test.go
