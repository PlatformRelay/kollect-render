sonar.projectKey=PlatformRelay_kollect-render
sonar.organization=platformrelay
sonar.projectName=kollect-render
sonar.sources=.
sonar.exclusions=dist/**,bin/**,test/golden/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# NOTE (E4-S02): Test arrange-invoke-assert clones are intentional CLI contract
# readability — exclude *_test.go from CPD so new_duplicated_lines_density
# clears without silencing production duplication. Production paths stay in CPD.
# Regression-guarded by hack/test/sonar_e4_s02_scope_test.sh.
sonar.cpd.exclusions=**/*_test.go

# NOTE (E4-S02): go:S3776 (Cognitive Complexity) in *_test.go is often the
# natural cost of table-driven / multi-case CLI contract tests. Scope the
# ignore to tests only — MUST NOT silence production hits at
# cmd/kollect-render/main.go, internal/format/env_inventory.go, or
# internal/format/confluence.go. Regression-guarded by
# hack/test/sonar_e4_s02_scope_test.sh.
sonar.issue.ignore.multicriteria=s3776tests,s1186model,s8196model
sonar.issue.ignore.multicriteria.s3776tests.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.s3776tests.resourceKey=**/*_test.go

# NOTE (E4-S06): go:S1186 on internal/format/model.go are the empty marker
# methods (block()/inline()) that seal the Block and Inline sum types. They
# must stay empty; fourteen nested brace comments would be cargo cult. Scope
# to model.go ONLY so a real empty stub elsewhere (e.g. internal/render/) is
# still flagged. Regression-guarded by hack/test/sonar_e4_s06_scope_test.sh.
sonar.issue.ignore.multicriteria.s1186model.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.s1186model.resourceKey=**/internal/format/model.go

# NOTE (E4-S06): godre:S8196 wants Block/Inline renamed to -er form. That
# convention is for behavioural single-method interfaces (Reader, Stringer);
# Blocker/Inliner would mislead for sealed sum types and churn every encoder.
# Reject the rename; document on the interfaces instead. Scope to model.go
# ONLY. Regression-guarded by hack/test/sonar_e4_s06_scope_test.sh.
sonar.issue.ignore.multicriteria.s8196model.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.s8196model.resourceKey=**/internal/format/model.go
